name: Environment Deployment

on:
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy to dev
        run: echo "Deploying to dev"

      - name: Show dev secret
        run: echo "${{ secrets.DEPLOY_MESSAGE }}"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production
        run: echo "Deploying to production"

      - name: Show production secret
        run: echo "${{ secrets.DEPLOY_MESSAGE }}"
